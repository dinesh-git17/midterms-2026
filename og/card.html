<!doctype html>
<!-- Share card source. Render with og/render.sh to public/og.jpg (1200 x 630). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..600,50&family=Instrument+Sans:wght@400..600&display=block">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f4efe0 url(capitol-art.png) no-repeat 0 0 / 1200px 630px; color: #12181c; font-family: "Instrument Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .text { position: absolute; left: 72px; top: 64px; bottom: 64px; width: 400px; display: flex; flex-direction: column; }
  .mark { width: 120px; height: auto; display: block; }
  h1 { margin: auto 0 0; font-family: "Fraunces", serif; font-weight: 550; font-size: 76px; line-height: 0.98; letter-spacing: -0.025em; font-variation-settings: "SOFT" 50, "WONK" 0; }
  p { margin: 22px 0 0; font-size: 24px; line-height: 1.35; color: #3a444a; }
  .url { margin-top: auto; font-size: 20px; font-weight: 600; color: #0f6b6b; }
</style>
</head>
<body>
  <div class="text">
    <img class="mark" src="../src/assets/wordmark.svg" alt="dins">
    <h1>Midterm results, live</h1>
    <p>Senate, House and governors, state by state. Updated every 30 seconds.</p>
    <span class="url">midterms.dins.dev</span>
  </div>
</body>
</html>
